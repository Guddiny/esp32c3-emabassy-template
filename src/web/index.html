<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>ESP32 Settings</title>
        <style>
            /* ─────────────  Modern Card UI (GyverLibs-like)  ───────────── */
            *,
            *::before,
            *::after {
                box-sizing: border-box;
            }

            :root {
                --primary: #0d6efd;
                --primary-hover: #0b5ed7;
                --primary-rgb: 13, 110, 253;
                --bg-body: #f5f7fa;
                --bg-header: #f5f7fa;
                --bg-card: #ffffff;
                --text-main: #1a1d21;
                --text-muted: #6b7280;
                --border-color: #e5e7eb;
                --radius-card: 12px;
                --radius-control: 8px;
                --radius-pill: 20px;
                --shadow-card:
                    0 1px 3px rgba(0, 0, 0, 0.06), 0 1px 2px rgba(0, 0, 0, 0.04);
                --shadow-hover: 0 4px 12px rgba(0, 0, 0, 0.08);
            }

            @media (prefers-color-scheme: dark) {
                :root {
                    --primary: #4a9eff;
                    --primary-hover: #3a8eef;
                    --primary-rgb: 74, 158, 255;
                    --bg-body: #0f1115;
                    --bg-card: #1a1d23;
                    --bg-header: #202530;
                    --text-main: #e5e7eb;
                    --text-muted: #9ca3af;
                    --border-color: #2d323c;
                    --shadow-card: 0 1px 3px rgba(0, 0, 0, 0.4);
                    --shadow-hover: 0 4px 16px rgba(0, 0, 0, 0.5);
                }
            }

            body {
                max-width: 600px;
                margin: 0 auto;
                padding: 16px;
                font:
                    14px/1.5 system-ui,
                    -apple-system,
                    "Segoe UI",
                    Roboto,
                    sans-serif;
                color: var(--text-main);
                background: var(--bg-body);
                transition:
                    background 0.15s,
                    color 0.15s;
            }

            /* ─────────────  Header  ───────────── */
            header {
                display: flex;
                justify-content: space-between;
                align-items: center;
                padding-bottom: 16px;
                margin-bottom: 20px;
                border-bottom: 1px solid var(--border-color);
            }

            h1 {
                font-size: 18px;
                font-weight: 600;
                margin: 0;
                letter-spacing: -0.01em;
            }

            .status {
                display: inline-flex;
                align-items: center;
                gap: 6px;
                font-size: 12px;
                font-weight: 500;
                color: var(--text-muted);
                padding: 4px 10px;
                background: var(--bg-card);
                border-radius: var(--radius-pill);
                box-shadow: var(--shadow-card);
            }
            .status::before {
                content: "";
                width: 6px;
                height: 6px;
                border-radius: 50%;
                background: var(--text-muted);
                transition: background 0.2s;
            }
            .status.connected::before {
                background: #22c55e;
            }
            .status.connecting::before {
                background: #f59e0b;
                animation: pulse 1.2s infinite;
            }
            .status.error::before {
                background: #ef4444;
            }

            @keyframes pulse {
                50% {
                    opacity: 0.3;
                }
            }

            /* ─────────────  Tabs  ───────────── */
            .tabs {
                display: flex;
                gap: 4px;
                padding: 4px;
                background: var(--bg-card);
                border-radius: var(--radius-pill);
                box-shadow: var(--shadow-card);
                margin-bottom: 20px;
                overflow-x: auto;
                scrollbar-width: none;
            }
            .tabs::-webkit-scrollbar {
                display: none;
            }

            .tab {
                flex: 1;
                padding: 8px 16px;
                font: inherit;
                font-size: 13px;
                font-weight: 500;
                color: var(--text-muted);
                background: transparent;
                border: none;
                border-radius: var(--radius-pill);
                cursor: pointer;
                white-space: nowrap;
                transition: all 0.15s;
            }
            .tab.active {
                color: #fff;
                background: var(--primary);
            }

            /* ─────────────  Panels  ───────────── */
            .panel {
                display: none;
            }
            .panel.active {
                display: flex;
                flex-direction: column;
                gap: 16px;
            }

            /* ─────────────  Cards (Groups)  ───────────── */
            .card {
                background: var(--bg-card);
                border-radius: var(--radius-card);
                box-shadow: var(--shadow-card);
                overflow: hidden;
                transition: box-shadow 0.15s;
            }
            .card:hover {
                box-shadow: var(--shadow-hover);
            }

            .card-header {
                padding: 14px 16px;
                display: flex;
                justify-content: space-between;
                align-items: center;
                font-size: 14px;
                font-weight: 600;
                cursor: pointer;
                user-select: none;
                background-color: var(--bg-header);
                border-bottom: 1px solid var(--border-color);
            }
            .card.collapsed .card-header {
                border-bottom: none;
            }
            .chev {
                font-size: 12px;
                color: var(--text-muted);
                transition: transform 0.15s;
            }
            .card.collapsed .chev {
                transform: rotate(-90deg);
            }

            .card-body {
                padding: 16px;
                display: flex;
                flex-direction: column;
                gap: 16px;
            }
            .card-body.horizontal {
                flex-direction: row;
                flex-wrap: wrap;
                align-items: flex-end;
            }
            .card-body.horizontal > * {
                flex: 1 1 140px;
                min-width: 0;
            }

            /* Flat group (no label) – просто отступы */
            .flat {
                display: flex;
                flex-direction: column;
                gap: 16px;
                padding: 4px 0;
            }
            .flat.horizontal {
                flex-direction: row;
                flex-wrap: wrap;
                align-items: flex-end;
            }
            .flat.horizontal > * {
                flex: 1 1 140px;
                min-width: 0;
            }

            /* ─────────────  Widget  ───────────── */
            .widget {
                display: flex;
                flex-direction: column;
                gap: 6px;
            }
            .row {
                display: flex;
                align-items: center;
                justify-content: space-between;
                gap: 12px;
            }
            .label {
                font-size: 13px;
                font-weight: 500;
                color: var(--text-main);
            }
            .value {
                font-size: 12px;
                color: var(--text-muted);
                font-variant-numeric: tabular-nums;
            }

            /* ─────────────  Controls  ───────────── */
            .input,
            .select {
                width: 100%;
                padding: 8px 12px;
                font: inherit;
                font-size: 13px;
                color: var(--text-main);
                background: var(--bg-body);
                border: 1px solid var(--border-color);
                border-radius: var(--radius-control);
                outline: none;
                transition:
                    border-color 0.15s,
                    box-shadow 0.15s;
            }
            .input:focus,
            .select:focus {
                border-color: var(--primary);
                box-shadow: 0 0 0 3px rgba(var(--primary-rgb), 0.15);
            }
            .input::placeholder {
                color: var(--text-muted);
            }

            /* Range */
            .range {
                -webkit-appearance: none;
                appearance: none;
                width: 100%;
                height: 6px;
                background: var(--border-color);
                border-radius: 999px;
                outline: none;
                margin: 8px 0;
            }
            .range::-webkit-slider-thumb {
                -webkit-appearance: none;
                appearance: none;
                width: 18px;
                height: 18px;
                background: var(--primary);
                border: 2px solid var(--bg-card);
                border-radius: 50%;
                box-shadow: 0 1px 4px rgba(0, 0, 0, 0.2);
                cursor: pointer;
            }
            .range::-moz-range-thumb {
                width: 18px;
                height: 18px;
                background: var(--primary);
                border: 2px solid var(--bg-card);
                border-radius: 50%;
                box-shadow: 0 1px 4px rgba(0, 0, 0, 0.2);
                cursor: pointer;
            }

            /* Switch */
            .switch {
                appearance: none;
                -webkit-appearance: none;
                position: relative;
                flex-shrink: 0;
                width: 36px;
                height: 20px;
                background: var(--border-color);
                border-radius: 10px;
                cursor: pointer;
                margin: 0;
                border: none;
                transition: background 0.15s;
            }
            .switch::after {
                content: "";
                position: absolute;
                top: 2px;
                left: 2px;
                width: 16px;
                height: 16px;
                background: #fff;
                border-radius: 50%;
                box-shadow: 0 1px 2px rgba(0, 0, 0, 0.2);
                transition: left 0.15s;
            }
            .switch:checked {
                background: var(--primary);
            }
            .switch:checked::after {
                left: 18px;
            }

            /* Indicator */
            .indicator {
                appearance: none;
                -webkit-appearance: none;
                width: 14px;
                height: 14px;
                border-radius: 50%;
                border: 1px solid var(--border-color);
                background: transparent;
                cursor: pointer;
                margin: 0;
                flex-shrink: 0;
                transition: background 0.15s;
            }
            .indicator:checked {
                background: var(--primary);
                border-color: var(--primary);
            }

            /* Button */
            .btn {
                padding: 8px 16px;
                font: inherit;
                font-size: 13px;
                font-weight: 500;
                color: #fff;
                background: var(--primary);
                border: none;
                border-radius: var(--radius-control);
                cursor: pointer;
                transition:
                    background 0.15s,
                    transform 0.05s;
                width: 100%;
            }
            .btn:hover {
                background: var(--primary-hover);
            }
            .btn:active {
                transform: scale(0.98);
            }
            .btn.outline {
                background: transparent;
                color: var(--primary);
                border: 1px solid var(--primary);
            }

            /* Progress */
            .progress {
                width: 100%;
                height: 8px;
                background: var(--border-color);
                border-radius: 999px;
                overflow: hidden;
            }
            .progress-fill {
                height: 100%;
                background: var(--primary);
                border-radius: 999px;
                transition: width 0.3s;
            }

            /* Spinner */
            .spinner {
                width: 16px;
                height: 16px;
                border: 2px solid var(--border-color);
                border-top-color: var(--primary);
                border-radius: 50%;
                animation: spin 0.8s linear infinite;
                flex-shrink: 0;
            }
            @keyframes spin {
                to {
                    transform: rotate(360deg);
                }
            }
            .ring-off {
                width: 16px;
                height: 16px;
                border-radius: 50%;
                border: 2px solid var(--border-color);
                flex-shrink: 0;
            }

            /* Log */
            .log {
                padding: 10px;
                background: var(--bg-body);
                border-radius: var(--radius-control);
                font:
                    11px/1.5 ui-monospace,
                    Menlo,
                    monospace;
                max-height: 200px;
                overflow: auto;
                white-space: pre-wrap;
                word-break: break-word;
                margin: 0;
                color: var(--text-main);
                border: 1px solid var(--border-color);
            }

            /* Notification */
            .notice {
                padding: 10px 12px;
                border-left: 3px solid var(--primary);
                border-radius: var(--radius-control);
                font-size: 13px;
                background: var(--bg-card);
            }
            .notice.warning {
                border-left-color: #f59e0b;
            }
            .notice.error {
                border-left-color: #ef4444;
            }

            /* Toast */
            #toast-container {
                position: fixed;
                bottom: 16px;
                left: 50%;
                transform: translateX(-50%);
                display: flex;
                flex-direction: column;
                gap: 6px;
                z-index: 100;
            }
            .toast {
                padding: 8px 16px;
                background: var(--text-main);
                color: var(--bg-card);
                border-radius: var(--radius-pill);
                font-size: 13px;
                box-shadow: var(--shadow-hover);
                animation: slidein 0.2s ease;
            }
            @keyframes slidein {
                from {
                    opacity: 0;
                    transform: translateY(8px);
                }
                to {
                    opacity: 1;
                    transform: translateY(0);
                }
            }

            .empty {
                text-align: center;
                padding: 48px 16px;
                color: var(--text-muted);
                font-size: 13px;
            }

            #widgets {
                display: flex;
                flex-direction: column;
                gap: 16px;
            }

            @media (max-width: 480px) {
                body {
                    padding: 12px;
                }
                .tab {
                    padding: 6px 12px;
                    font-size: 12px;
                }
                .card-body {
                    padding: 12px;
                }
            }
        </style>
    </head>
    <body>
        <header>
            <h1>ESP32 Settings</h1>
            <div class="status connecting" id="status">Connecting…</div>
        </header>

        <main id="widgets">
            <div class="empty">Loading…</div>
        </main>

        <div id="toast-container"></div>

        <script>
            "use strict";

            const CONFIG = {
                wsUrl: `ws://${location.host}/ws`,
                reconnectDelay: 1500,
                maxReconnectDelay: 30000,
                pingInterval: 25000,
            };

            const state = {
                ws: null,
                reconnectDelay: CONFIG.reconnectDelay,
                reconnectTimer: null,
                pingTimer: null,
                connected: false,
                activeTabs: new Map(),
                collapsedGroups: new Map(),
            };

            const dom = {
                status: document.getElementById("status"),
                widgets: document.getElementById("widgets"),
                toasts: document.getElementById("toast-container"),
            };

            /* ─── Utils ─── */
            function escapeHtml(s) {
                return String(s ?? "").replace(
                    /[&<>"']/g,
                    (c) =>
                        ({
                            "&": "&amp;",
                            "<": "&lt;",
                            ">": "&gt;",
                            '"': "&quot;",
                            "'": "&#39;",
                        })[c],
                );
            }

            function setStatus(mode, text) {
                dom.status.className = `status ${mode}`;
                dom.status.textContent = text;
            }

            function toast(text, duration = 2500) {
                const el = document.createElement("div");
                el.className = "toast";
                el.textContent = text;
                dom.toasts.appendChild(el);
                setTimeout(() => el.remove(), duration);
            }

            /* ─── Central action dispatcher with trigger_update ─── */
            function sendAction(w, value) {
                if (w.trigger_update === false) {
                    console.debug(
                        `[local] id=${w.id} value=${JSON.stringify(value)}`,
                    );
                    return;
                }
                if (!send({ type: "action", id: w.id, value: String(value) })) {
                    toast("No connection");
                }
            }

            /* ─── WebSocket ─── */
            function connect() {
                if (state.ws && state.ws.readyState <= WebSocket.OPEN) return;
                setStatus("connecting", "Connecting…");

                try {
                    state.ws = new WebSocket(CONFIG.wsUrl);
                } catch (e) {
                    setStatus("error", "Error");
                    scheduleReconnect();
                    return;
                }

                state.ws.onopen = () => {
                    state.connected = true;
                    state.reconnectDelay = CONFIG.reconnectDelay;
                    setStatus("connected", "Connected");
                    send({ type: "init", schema: 1 });
                    state.pingTimer = setInterval(
                        () => send({ type: "ping" }),
                        CONFIG.pingInterval,
                    );
                };

                state.ws.onmessage = (event) => {
                    try {
                        const data = JSON.parse(event.data);
                        if (Array.isArray(data)) render(data);
                        else if (data && data.error) toast(data.error);
                    } catch (e) {
                        console.error("Bad WS message:", e, event.data);
                    }
                };

                state.ws.onerror = () => {};
                state.ws.onclose = () => {
                    state.connected = false;
                    if (state.pingTimer) {
                        clearInterval(state.pingTimer);
                        state.pingTimer = null;
                    }
                    setStatus("error", "Disconnected");
                    scheduleReconnect();
                };
            }

            function scheduleReconnect() {
                if (state.reconnectTimer) return;
                const delay = state.reconnectDelay;
                setStatus(
                    "connecting",
                    `Retry in ${Math.round(delay / 1000)}s…`,
                );
                state.reconnectTimer = setTimeout(() => {
                    state.reconnectTimer = null;
                    state.reconnectDelay = Math.min(
                        state.reconnectDelay * 1.5,
                        CONFIG.maxReconnectDelay,
                    );
                    connect();
                }, delay);
            }

            function send(obj) {
                if (state.ws && state.ws.readyState === WebSocket.OPEN) {
                    state.ws.send(JSON.stringify(obj));
                    return true;
                }
                return false;
            }

            /* ─── Render ─── */
            function render(widgets) {
                const active = document.activeElement;
                const focusedWrapper = active?.closest("[data-widget-id]");
                const focusedWidgetId = focusedWrapper?.dataset?.widgetId;
                const focusedField =
                    active && /^(INPUT|SELECT|TEXTAREA)$/.test(active.tagName)
                        ? active
                        : null;
                const focusedValue =
                    focusedField && focusedField.type !== "checkbox"
                        ? focusedField.value
                        : undefined;
                let selStart, selEnd;
                try {
                    selStart = focusedField?.selectionStart;
                    selEnd = focusedField?.selectionEnd;
                } catch (e) {}

                const byParent = new Map();
                for (const w of widgets) {
                    const pid = w.parent_id ?? w.parent ?? 0;
                    if (!byParent.has(pid)) byParent.set(pid, []);
                    byParent.get(pid).push(w);
                }

                dom.widgets.innerHTML = "";

                if (widgets.length === 0) {
                    dom.widgets.innerHTML =
                        '<div class="empty">No widgets</div>';
                    return;
                }

                renderLevel(0, dom.widgets, byParent);

                if (focusedWidgetId) {
                    const root = dom.widgets.querySelector(
                        `[data-widget-id="${focusedWidgetId}"]`,
                    );
                    if (root) {
                        const input = root.querySelector(
                            "input:not([type=checkbox]), select, button",
                        );
                        if (input) {
                            input.focus();
                            if (
                                focusedValue !== undefined &&
                                input.value !== undefined
                            )
                                input.value = focusedValue;
                            if (
                                selStart !== undefined &&
                                selEnd !== undefined &&
                                input.setSelectionRange
                            ) {
                                try {
                                    input.setSelectionRange(selStart, selEnd);
                                } catch (e) {}
                            }
                        }
                    }
                }
            }

            function renderLevel(parentId, container, byParent) {
                const children = byParent.get(parentId) || [];
                if (children.length === 0) return;

                const hasTabs = children.some((w) => w.type === "tab");
                if (!hasTabs) {
                    for (const w of children)
                        container.appendChild(renderWidget(w, byParent));
                    return;
                }

                const sections = [];
                let current = null;
                for (const w of children) {
                    if (w.type === "tab") {
                        current = { tab: w, content: [] };
                        sections.push(current);
                    } else if (current) {
                        current.content.push(w);
                    } else {
                        container.appendChild(renderWidget(w, byParent));
                    }
                }

                for (const section of sections) {
                    if (section.tab.id === 0) continue;
                    const explicit = byParent.get(section.tab.id) || [];
                    for (const w of explicit) {
                        if (w.type === "tab") continue;
                        if (section.content.find((c) => c.id === w.id))
                            continue;
                        section.content.push(w);
                    }
                }

                const tabBar = document.createElement("div");
                tabBar.className = "tabs";
                tabBar.setAttribute("role", "tablist");

                const panels = [];
                const buttons = [];

                for (let i = 0; i < sections.length; i++) {
                    const section = sections[i];
                    const btn = document.createElement("button");
                    btn.type = "button";
                    btn.className = "tab";
                    btn.textContent = section.tab.label || `Tab ${i + 1}`;
                    btn.addEventListener("click", () => setActive(i));
                    tabBar.appendChild(btn);
                    buttons.push(btn);

                    const panel = document.createElement("div");
                    panel.className = "panel";
                    panel.setAttribute("role", "tabpanel");
                    for (const w of section.content)
                        panel.appendChild(renderWidget(w, byParent));
                    panels.push(panel);
                }

                let activeIndex = 0;
                const savedTabId = state.activeTabs.get(parentId);
                if (savedTabId !== undefined) {
                    const idx = sections.findIndex(
                        (s) => s.tab.id === savedTabId,
                    );
                    if (idx >= 0) activeIndex = idx;
                }

                function setActive(i) {
                    buttons.forEach((b, idx) =>
                        b.classList.toggle("active", idx === i),
                    );
                    panels.forEach((p, idx) =>
                        p.classList.toggle("active", idx === i),
                    );
                    if (sections[i])
                        state.activeTabs.set(parentId, sections[i].tab.id);
                }

                setActive(activeIndex);

                container.appendChild(tabBar);
                for (const p of panels) container.appendChild(p);
            }

            function renderWidget(w, byParent) {
                let el;
                switch (w.type) {
                    case "group":
                        el = renderGroup(w, byParent);
                        break;
                    case "toggle":
                        el = renderToggle(w);
                        break;
                    case "slider":
                        el = renderSlider(w);
                        break;
                    case "input":
                        el = renderInput(w);
                        break;
                    case "select":
                        el = renderSelect(w);
                        break;
                    case "button":
                        el = renderButton(w);
                        break;
                    case "progress_bar":
                        el = renderProgressBar(w);
                        break;
                    case "progress_ring":
                        el = renderProgressRing(w);
                        break;
                    case "indicator":
                        el = renderIndicator(w);
                        break;
                    case "label":
                        el = renderLabel(w);
                        break;
                    case "log":
                        el = renderLog(w);
                        break;
                    case "notification":
                        el = renderNotification(w);
                        break;
                    default:
                        el = document.createElement("div");
                        el.className = "empty";
                        el.textContent = `Unknown: ${w.type}`;
                }
                el.dataset.widgetId = w.id;
                return el;
            }

            function renderGroup(w, byParent) {
                const el = document.createElement("div");
                const hasLabel = w.label && w.label.length > 0;
                const alignment = w.alignment?.alignment ?? "vertical";
                const children = byParent.get(w.id) || [];

                if (hasLabel) {
                    el.className = "card";
                    const stored = state.collapsedGroups.get(w.id);
                    const collapsed =
                        stored !== undefined ? stored : w.collapsed || false;


                    const header = document.createElement("div");
                    header.className = "card-header";
                    header.innerHTML = `<span>${escapeHtml(w.label)}</span><span class="chev"></span>`;

                    el.appendChild(header);

                    const body = document.createElement("div");
                    body.className =
                        "card-body" +
                        (alignment === "horizontal" ? " horizontal" : "");
                    for (const child of children)
                        body.appendChild(renderWidget(child, byParent));
                    el.appendChild(body);
                } else {
                    el.className =
                        "flat" +
                        (alignment === "horizontal" ? " horizontal" : "");
                    for (const child of children)
                        el.appendChild(renderWidget(child, byParent));
                }

                return el;
            }

            function renderToggle(w) {
                const el = document.createElement("div");
                el.className = "widget";
                el.innerHTML = `
        <div class="row">
            <span class="label">${escapeHtml(w.label || "")}</span>
            <input type="checkbox" class="switch" ${w.value ? "checked" : ""}>
        </div>
    `;
                const cb = el.querySelector("input");
                cb.addEventListener("change", () => sendAction(w, cb.checked));
                return el;
            }

            function renderIndicator(w) {
                const el = document.createElement("div");
                el.className = "widget";
                el.innerHTML = `
        <div class="row">
            <span class="label">${escapeHtml(w.label || "")}</span>
            <input type="checkbox" class="indicator" ${w.enabled ? "checked" : ""}>
        </div>
    `;
                const cb = el.querySelector("input");
                cb.addEventListener("change", () => sendAction(w, cb.checked));
                return el;
            }

            function renderSlider(w) {
                const el = document.createElement("div");
                el.className = "widget";
                const min = w.min ?? 0,
                    max = w.max ?? 100,
                    val = w.value ?? min;
                el.innerHTML = `
        <div class="row">
            <span class="label">${escapeHtml(w.label || "")}</span>
            <span class="value">${val}</span>
        </div>
        <input type="range" class="range" min="${min}" max="${max}" value="${val}">
    `;

                const range = el.querySelector("input");
                const display = el.querySelector(".value");
                let throttleTimer = null,
                    pendingValue = null;

                const flush = () => {
                    throttleTimer = null;
                    if (pendingValue !== null) {
                        sendAction(w, pendingValue);
                        pendingValue = null;
                    }
                };

                range.addEventListener("input", () => {
                    const v = parseInt(range.value, 10);
                    display.textContent = v;
                    pendingValue = v;
                    if (!throttleTimer) throttleTimer = setTimeout(flush, 60);
                });
                range.addEventListener("change", () => {
                    pendingValue = parseInt(range.value, 10);
                    if (throttleTimer) {
                        clearTimeout(throttleTimer);
                        flush();
                    }
                });
                return el;
            }

            function renderInput(w) {
                const el = document.createElement("div");
                el.className = "widget";
                const type = w.input_type || "text";
                const id = `inp-${w.id}`;
                el.innerHTML = `
        <label class="label" for="${id}">${escapeHtml(w.label || "")}</label>
        <input type="${escapeHtml(type)}" class="input" id="${id}"
               value="${escapeHtml(w.value ?? "")}"
               placeholder="${escapeHtml(w.placeholder || "")}"
               spellcheck="false" autocomplete="off">
    `;
                const inp = el.querySelector("input");
                inp.addEventListener("blur", () => {
                    if (inp.value !== String(w.value ?? ""))
                        sendAction(w, inp.value);
                });
                inp.addEventListener("keydown", (e) => {
                    if (e.key === "Enter") {
                        e.preventDefault();
                        inp.blur();
                    }
                    if (e.key === "Escape") {
                        inp.value = String(w.value ?? "");
                        inp.blur();
                    }
                });
                return el;
            }

            function renderSelect(w) {
                const el = document.createElement("div");
                el.className = "widget";
                const selectedIndex = w.selected_index ?? w.value ?? 0;
                const id = `sel-${w.id}`;
                const options = (w.options || [])
                    .map(
                        (label, i) =>
                            `<option value="${i}" ${i === selectedIndex ? "selected" : ""}>${escapeHtml(label)}</option>`,
                    )
                    .join("");
                el.innerHTML = `
        <label class="label" for="${id}">${escapeHtml(w.label || "")}</label>
        <select class="select" id="${id}">${options}</select>
    `;
                const sel = el.querySelector("select");
                sel.addEventListener("change", () =>
                    sendAction(w, parseInt(sel.value, 10)),
                );
                return el;
            }

            function renderButton(w) {
                const el = document.createElement("div");
                el.className = "widget";
                const btn = document.createElement("button");
                btn.type = "button";
                btn.className = "btn";
                btn.textContent = w.label || "Button";
                btn.addEventListener("click", () =>
                    sendAction(w, w.value ?? "click"),
                );
                el.appendChild(btn);
                return el;
            }

            function renderProgressBar(w) {
                const el = document.createElement("div");
                el.className = "widget";
                const progress = Math.max(0, Math.min(100, w.progress ?? 0));
                const hasLabel = (w.label || "").length > 0;
                const hasText = (w.text || "").length > 0;

                el.innerHTML = `
        ${
            hasLabel || hasText
                ? `
            <div class="row">
                <span class="label">${escapeHtml(w.label || "")}</span>
                <span class="value">${escapeHtml(w.text || "")}</span>
            </div>
        `
                : ""
        }
        <div class="progress">
            <div class="progress-fill" style="width:${progress}%"></div>
        </div>
    `;
                return el;
            }

            function renderProgressRing(w) {
                const el = document.createElement("div");
                el.className = "widget";
                el.innerHTML = `
        <div class="row">
            <span class="label">${escapeHtml(w.label || "")}</span>
            ${w.in_progress ? '<div class="spinner"></div>' : '<div class="ring-off"></div>'}
        </div>
    `;
                return el;
            }

            function renderLabel(w) {
                const el = document.createElement("div");
                el.className = "widget";
                if (w.label && w.label.length > 0) {
                    el.innerHTML = `
            <div class="row">
                <span class="label">${escapeHtml(w.label)}</span>
                <span class="value">${escapeHtml(w.text || "")}</span>
            </div>
        `;
                } else {
                    el.innerHTML = `<div class="value">${escapeHtml(w.text || "")}</div>`;
                }
                return el;
            }

            function renderLog(w) {
                const el = document.createElement("div");
                el.className = "widget";
                const hasLabel = (w.label || "").length > 0;
                el.innerHTML = `
        ${hasLabel ? `<label class="label">${escapeHtml(w.label)}</label>` : ""}
        <pre class="log">${escapeHtml(w.text || "")}</pre>
    `;
                return el;
            }

            function renderNotification(w) {
                const el = document.createElement("div");
                el.className = "widget";
                const kind = w.kind || "info";
                el.innerHTML = `<div class="notice ${kind}">${escapeHtml(w.message || "")}</div>`;
                return el;
            }

            /* ─── Init ─── */
            window.addEventListener("DOMContentLoaded", connect);
            window.addEventListener("beforeunload", () => {
                if (state.ws) state.ws.close();
            });
            document.addEventListener("visibilitychange", () => {
                if (
                    !document.hidden &&
                    !state.connected &&
                    !state.reconnectTimer
                )
                    connect();
            });
        </script>
    </body>
</html>
