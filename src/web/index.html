<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ESP32 Settings</title>
  <style>
    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }

    :root {
      --fg: #111;
      --bg: #fff;
      --muted: #6b7280;
      --border: #e5e7eb;
      --bg-soft: #f9fafb;
      --accent: #111;
      --accent-fg: #fff;
      --success: #22c55e;
      --warning: #f59e0b;
      --danger: #ef4444;
      --radius: 6px;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --fg: #e5e7eb;
        --bg: #111;
        --muted: #9ca3af;
        --border: #333;
        --bg-soft: #1a1a1a;
        --accent: #e5e7eb;
        --accent-fg: #111;
      }
    }

    body {
      max-width: 560px;
      margin: 0 auto;
      padding: 16px;
      font: 14px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
      color: var(--fg);
      background: var(--bg);
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 12px;
      margin-bottom: 16px;
      border-bottom: 1px solid var(--border);
    }

    h1 {
      font-size: 16px;
      font-weight: 600;
      margin: 0;
    }

    .status {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      color: var(--muted);
    }

    .status::before {
      content: '';
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--muted);
      transition: background .2s;
    }

    .status.connected::before {
      background: var(--success);
    }

    .status.connecting::before {
      background: var(--warning);
      animation: pulse 1.2s infinite;
    }

    .status.error::before {
      background: var(--danger);
    }

    @keyframes pulse {
      50% {
        opacity: .3;
      }
    }

    .tabs {
      display: flex;
      border-bottom: 1px solid var(--border);
      overflow-x: auto;
      scrollbar-width: none;
    }

    .tabs::-webkit-scrollbar {
      display: none;
    }

    .tab {
      padding: 8px 14px;
      font: inherit;
      font-size: 13px;
      color: var(--muted);
      background: none;
      border: none;
      border-bottom: 2px solid transparent;
      margin-bottom: -1px;
      cursor: pointer;
      white-space: nowrap;
      transition: color .15s, border-color .15s;
    }

    .tab.active {
      color: var(--fg);
      border-bottom-color: var(--fg);
    }

    .panel {
      display: none;
    }

    .panel.active {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .card {
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
    }

    .card-header {
      padding: 10px 12px;
      background: var(--bg-soft);
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      user-select: none;
    }

    .chev {
      font-size: 10px;
      color: var(--muted);
      transition: transform .15s;
    }

    .card.collapsed .chev {
      transform: rotate(-90deg);
    }

    .card.collapsed>.card-header {
      border-bottom: none;
    }

    .card.collapsed>.card-body {
      display: none;
    }

    .card-body {
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .card-body.horizontal {
      flex-direction: row;
      flex-wrap: wrap;
      align-items: flex-end;
    }

    .card-body.horizontal>* {
      flex: 1 1 140px;
      min-width: 0;
    }

    .flat {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .flat.horizontal {
      flex-direction: row;
      flex-wrap: wrap;
      align-items: flex-end;
    }

    .flat.horizontal>* {
      flex: 1 1 140px;
      min-width: 0;
    }

    .widget {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .label {
      font-size: 13px;
      font-weight: 500;
    }

    .value {
      font-size: 12px;
      color: var(--muted);
      font-variant-numeric: tabular-nums;
    }

    .input,
    .select {
      width: 100%;
      padding: 6px 10px;
      font: inherit;
      font-size: 13px;
      color: var(--fg);
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      outline: none;
      transition: border-color .15s;
    }

    .input:focus,
    .select:focus {
      border-color: var(--fg);
    }

    .input::placeholder {
      color: var(--muted);
    }

    .range {
      width: 100%;
      accent-color: var(--fg);
    }

    .switch {
      appearance: none;
      -webkit-appearance: none;
      position: relative;
      flex-shrink: 0;
      width: 32px;
      height: 18px;
      background: var(--border);
      border-radius: 9px;
      cursor: pointer;
      margin: 0;
      border: none;
      transition: background .15s;
    }

    .switch::after {
      content: '';
      position: absolute;
      top: 2px;
      left: 2px;
      width: 14px;
      height: 14px;
      background: #fff;
      border-radius: 50%;
      box-shadow: 0 1px 2px rgba(0, 0, 0, .2);
      transition: left .15s;
    }

    .switch:checked {
      background: var(--fg);
    }

    .switch:checked::after {
      left: 16px;
    }

    .indicator {
      appearance: none;
      -webkit-appearance: none;
      width: 12px;
      height: 12px;
      border-radius: 50%;
      border: 1px solid var(--border);
      background: transparent;
      cursor: pointer;
      margin: 0;
      flex-shrink: 0;
      transition: background .15s;
    }

    .indicator:checked {
      background: var(--success);
      border-color: var(--success);
    }

    .btn {
      padding: 6px 14px;
      font: inherit;
      font-size: 13px;
      font-weight: 500;
      color: var(--accent-fg);
      background: var(--accent);
      border: 1px solid var(--accent);
      border-radius: var(--radius);
      cursor: pointer;
      transition: opacity .15s;
    }

    .btn:hover {
      opacity: .85;
    }

    .btn.block {
      width: 100%;
    }

    .progress {
      width: 100%;
      height: 6px;
      background: var(--bg-soft);
      border-radius: 999px;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      background: var(--fg);
      transition: width .3s;
    }

    .spinner {
      width: 14px;
      height: 14px;
      border: 2px solid var(--border);
      border-top-color: var(--fg);
      border-radius: 50%;
      animation: spin .8s linear infinite;
      flex-shrink: 0;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    .ring-off {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      border: 2px solid var(--border);
      flex-shrink: 0;
    }

    .log {
      padding: 8px 10px;
      background: var(--bg-soft);
      border-radius: var(--radius);
      font: 12px/1.5 ui-monospace, "SF Mono", Menlo, monospace;
      max-height: 240px;
      overflow: auto;
      white-space: pre-wrap;
      word-break: break-word;
      margin: 0;
      color: var(--fg);
    }

    .notice {
      padding: 8px 10px;
      border-left: 3px solid;
      border-radius: var(--radius);
      font-size: 13px;
    }

    .notice.info {
      border-color: #3b82f6;
      background: rgba(59, 130, 246, .08);
    }

    .notice.warning {
      border-color: var(--warning);
      background: rgba(245, 158, 11, .08);
    }

    .notice.error {
      border-color: var(--danger);
      background: rgba(239, 68, 68, .08);
    }

    @media (prefers-color-scheme: dark) {
      .notice.info {
        background: rgba(59, 130, 246, .15);
      }

      .notice.warning {
        background: rgba(245, 158, 11, .15);
      }

      .notice.error {
        background: rgba(239, 68, 68, .15);
      }
    }

    #toast-container {
      position: fixed;
      bottom: 16px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      flex-direction: column;
      gap: 8px;
      z-index: 100;
      max-width: calc(100vw - 32px);
    }

    .toast {
      padding: 8px 12px;
      background: var(--fg);
      color: var(--bg);
      border-radius: var(--radius);
      font-size: 13px;
      box-shadow: 0 4px 12px rgba(0, 0, 0, .15);
      animation: slidein .2s ease;
    }

    @keyframes slidein {
      from {
        opacity: 0;
        transform: translateY(8px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .empty {
      text-align: center;
      padding: 40px 16px;
      color: var(--muted);
      font-size: 13px;
    }

    #widgets {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
  </style>
</head>

<body>

  <header>
    <h1>ESP32 Settings</h1>
    <div class="status connecting" id="status">Connecting…</div>
  </header>

  <main id="widgets">
    <div class="empty">Loading…</div>
  </main>

  <div id="toast-container"></div>

  <script>
    "use strict";

    const CONFIG = {
      wsUrl: `ws://${location.host}/ws`,
      reconnectDelay: 1500,
      maxReconnectDelay: 30000,
      pingInterval: 25000,
    };

    const MAX_LOGS = 500;
    const MAX_SEEN_DEVICE_LINES = 1000;

    const state = {
      ws: null,
      reconnectDelay: CONFIG.reconnectDelay,
      reconnectTimer: null,
      pingTimer: null,
      connected: false,
      activeTabs: new Map(),
      collapsedGroups: new Map(),
      // ─── Log state ───
      logs: [],                         // [{ts, source: 'client'|'device', text}]
      lastDeviceText: '',
      seenDeviceLines: new Set(),
    };

    const dom = {
      status: document.getElementById('status'),
      widgets: document.getElementById('widgets'),
      toasts: document.getElementById('toast-container'),
    };

    /* ─── Utils ─── */
    function escapeHtml(s) {
      return String(s ?? '').replace(/[&<>"']/g, c => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
      }[c]));
    }

    function setStatus(mode, text) {
      dom.status.className = `status ${mode}`;
      dom.status.textContent = text;
    }

    function toast(text, duration = 3000) {
      const el = document.createElement('div');
      el.className = 'toast';
      el.textContent = text;
      dom.toasts.appendChild(el);
      setTimeout(() => el.remove(), duration);
    }

    /* ─── Logging ─── */
    function addLog(source, text) {
      if (!text) return;
      state.logs.push({
        ts: new Date().toLocaleTimeString('en-GB', { hour12: false }),
        source,
        text: String(text),
      });
      if (state.logs.length > MAX_LOGS) state.logs = state.logs.slice(-MAX_LOGS);
      scheduleLogRefresh();
    }

    function formatLogs() {
      return state.logs.map(l =>
        l.source === 'client' ? `[${l.ts}] » ${l.text}` : l.text
      ).join('\n');
    }

    let logRefreshScheduled = false;
    function scheduleLogRefresh() {
      if (logRefreshScheduled) return;
      logRefreshScheduled = true;
      requestAnimationFrame(() => {
        logRefreshScheduled = false;
        document.querySelectorAll('.log[data-log-target]').forEach(pre => {
          const wasAtBottom = pre.scrollHeight - pre.scrollTop - pre.clientHeight < 20;
          pre.textContent = formatLogs();
          if (wasAtBottom) pre.scrollTop = pre.scrollHeight;
        });
      });
    }

    /**
     * Sync device-sent log records.
     * - Detects "reset" (log shrunk or changed non-prefix) → clears device entries
     * - Adds only new lines (deduplicated by content)
     * - Client-side entries preserved
     */
    function syncDeviceLog(text) {
      text = String(text ?? '');
      if (text === state.lastDeviceText) return;

      if (state.lastDeviceText && !text.startsWith(state.lastDeviceText)) {
        // Device log reset / cleared
        state.logs = state.logs.filter(l => l.source !== 'device');
        state.seenDeviceLines = new Set();
      }
      state.lastDeviceText = text;

      const lines = text.split('\n').filter(Boolean);
      for (const line of lines) {
        if (state.seenDeviceLines.has(line)) continue;
        state.seenDeviceLines.add(line);
        addLog('device', line);
      }

      // Cap dedup set
      if (state.seenDeviceLines.size > MAX_SEEN_DEVICE_LINES) {
        const arr = Array.from(state.seenDeviceLines);
        state.seenDeviceLines = new Set(arr.slice(-MAX_SEEN_DEVICE_LINES / 2));
      }
    }

    /* ─── WebSocket ─── */
    function connect() {
      if (state.ws && state.ws.readyState <= WebSocket.OPEN) return;
      setStatus('connecting', 'Connecting…');
      addLog('client', 'Connecting…');

      try {
        state.ws = new WebSocket(CONFIG.wsUrl);
      } catch (e) {
        setStatus('error', 'Error');
        addLog('client', `Connection error: ${e.message || e}`);
        scheduleReconnect();
        return;
      }

      state.ws.onopen = () => {
        state.connected = true;
        state.reconnectDelay = CONFIG.reconnectDelay;
        setStatus('connected', 'Connected');
        addLog('client', 'Connected');
        send({ type: 'init', schema: 1 });
        addLog('client', 'Sent init');
        state.pingTimer = setInterval(() => send({ type: 'ping' }), CONFIG.pingInterval);
      };

      state.ws.onmessage = (event) => {
        try {
          const data = JSON.parse(event.data);
          if (Array.isArray(data)) {
            render(data);
          } else if (data && data.error) {
            toast(data.error);
            addLog('device', `Error: ${data.error}`);
          }
        } catch (e) {
          console.error('Bad WS message:', e, event.data);
          addLog('device', `Malformed message (${String(event.data).length} bytes)`);
        }
      };

      state.ws.onerror = () => { };
      state.ws.onclose = () => {
        state.connected = false;
        if (state.pingTimer) { clearInterval(state.pingTimer); state.pingTimer = null; }
        setStatus('error', 'Disconnected');
        addLog('client', 'Disconnected');
        scheduleReconnect();
      };
    }

    function scheduleReconnect() {
      if (state.reconnectTimer) return;
      const delay = state.reconnectDelay;
      setStatus('connecting', `Retry in ${Math.round(delay / 1000)}s…`);
      addLog('client', `Reconnecting in ${Math.round(delay / 1000)}s`);
      state.reconnectTimer = setTimeout(() => {
        state.reconnectTimer = null;
        state.reconnectDelay = Math.min(state.reconnectDelay * 1.5, CONFIG.maxReconnectDelay);
        connect();
      }, delay);
    }

    function send(obj) {
      if (state.ws && state.ws.readyState === WebSocket.OPEN) {
        state.ws.send(JSON.stringify(obj));
        return true;
      }
      return false;
    }

    function sendAction(id, value) {
      const ok = send({ type: 'action', id, value: String(value) });
      if (!ok) {
        toast('No connection');
        addLog('client', `Action id=${id} failed (offline)`);
      } else {
        addLog('client', `Action id=${id} value=${JSON.stringify(value)}`);
      }
    }

    /* ─── Render ─── */
    function render(widgets) {
      // ─── Save focus & cursor ───
      const active = document.activeElement;
      const focusedWrapper = active?.closest('[data-widget-id]');
      const focusedWidgetId = focusedWrapper?.dataset?.widgetId;
      const focusedField = active && /^(INPUT|SELECT|TEXTAREA)$/.test(active.tagName) ? active : null;
      const focusedValue = focusedField && focusedField.type !== 'checkbox' ? focusedField.value : undefined;
      let selStart, selEnd;
      try { selStart = focusedField?.selectionStart; selEnd = focusedField?.selectionEnd; } catch (e) { }

      // ─── Save log scroll positions ───
      const logScrolls = new Map();
      document.querySelectorAll('.log[data-log-target]').forEach(pre => {
        const wrap = pre.closest('[data-widget-id]');
        if (wrap) {
          logScrolls.set(wrap.dataset.widgetId, {
            top: pre.scrollTop,
            atBottom: pre.scrollHeight - pre.scrollTop - pre.clientHeight < 20,
          });
        }
      });

      // ─── Build tree ───
      const byParent = new Map();
      for (const w of widgets) {
        const pid = w.parent_id ?? w.parent ?? 0;
        if (!byParent.has(pid)) byParent.set(pid, []);
        byParent.get(pid).push(w);
      }

      dom.widgets.innerHTML = '';

      if (widgets.length === 0) {
        dom.widgets.innerHTML = '<div class="empty">No widgets</div>';
        return;
      }

      renderLevel(0, dom.widgets, byParent);

      // ─── Restore log scroll after DOM is in place ───
      requestAnimationFrame(() => {
        document.querySelectorAll('.log[data-log-target]').forEach(pre => {
          const wrap = pre.closest('[data-widget-id]');
          const saved = wrap ? logScrolls.get(wrap.dataset.widgetId) : undefined;
          if (!saved || saved.atBottom) {
            pre.scrollTop = pre.scrollHeight;
          } else {
            pre.scrollTop = saved.top;
          }
        });
      });

      // ─── Restore focus ───
      if (focusedWidgetId) {
        const root = dom.widgets.querySelector(`[data-widget-id="${focusedWidgetId}"]`);
        if (root) {
          const input = root.querySelector('input:not([type=checkbox]), select, button');
          if (input) {
            input.focus();
            if (focusedValue !== undefined && input.value !== undefined) input.value = focusedValue;
            if (selStart !== undefined && selEnd !== undefined && input.setSelectionRange) {
              try { input.setSelectionRange(selStart, selEnd); } catch (e) { }
            }
          }
        }
      }
    }

    function renderLevel(parentId, container, byParent) {
      const children = byParent.get(parentId) || [];
      if (children.length === 0) return;

      const hasTabs = children.some(w => w.type === 'tab');
      if (!hasTabs) {
        for (const w of children) container.appendChild(renderWidget(w, byParent));
        return;
      }

      const sections = [];
      let current = null;
      for (const w of children) {
        if (w.type === 'tab') {
          current = { tab: w, content: [] };
          sections.push(current);
        } else if (current) {
          current.content.push(w);
        } else {
          container.appendChild(renderWidget(w, byParent));
        }
      }

      for (const section of sections) {
        if (section.tab.id === 0) continue;
        const explicit = byParent.get(section.tab.id) || [];
        for (const w of explicit) {
          if (w.type === 'tab') continue;
          if (section.content.find(c => c.id === w.id)) continue;
          section.content.push(w);
        }
      }

      const tabBar = document.createElement('div');
      tabBar.className = 'tabs';
      tabBar.setAttribute('role', 'tablist');

      const panels = [];
      const buttons = [];

      for (let i = 0; i < sections.length; i++) {
        const section = sections[i];
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'tab';
        btn.textContent = section.tab.label || `Tab ${i + 1}`;
        btn.addEventListener('click', () => setActive(i));
        tabBar.appendChild(btn);
        buttons.push(btn);

        const panel = document.createElement('div');
        panel.className = 'panel';
        panel.setAttribute('role', 'tabpanel');
        for (const w of section.content) panel.appendChild(renderWidget(w, byParent));
        panels.push(panel);
      }

      let activeIndex = 0;
      const savedTabId = state.activeTabs.get(parentId);
      if (savedTabId !== undefined) {
        const idx = sections.findIndex(s => s.tab.id === savedTabId);
        if (idx >= 0) activeIndex = idx;
      }

      function setActive(i) {
        buttons.forEach((b, idx) => b.classList.toggle('active', idx === i));
        panels.forEach((p, idx) => p.classList.toggle('active', idx === i));
        if (sections[i]) state.activeTabs.set(parentId, sections[i].tab.id);
      }

      setActive(activeIndex);

      container.appendChild(tabBar);
      for (const p of panels) container.appendChild(p);
    }

    function renderWidget(w, byParent) {
      let el;
      switch (w.type) {
        case 'group': el = renderGroup(w, byParent); break;
        case 'toggle': el = renderToggle(w); break;
        case 'slider': el = renderSlider(w); break;
        case 'input': el = renderInput(w); break;
        case 'select': el = renderSelect(w); break;
        case 'button': el = renderButton(w); break;
        case 'progressbar': el = renderProgressBar(w); break;
        case 'progress_ring': el = renderProgressRing(w); break;
        case 'indicator': el = renderIndicator(w); break;
        case 'label': el = renderLabel(w); break;
        case 'log': el = renderLog(w); break;
        case 'notification': el = renderNotification(w); break;
        default:
          el = document.createElement('div');
          el.className = 'empty';
          el.textContent = `Unknown: ${w.type}`;
      }
      el.dataset.widgetId = w.id;
      return el;
    }

    function renderGroup(w, byParent) {
      const el = document.createElement('div');
      const hasLabel = w.label && w.label.length > 0;
      const alignment = w.alignment?.alignment ?? 'vertical';
      const children = byParent.get(w.id) || [];

      if (hasLabel) {
        el.className = 'card';
        const stored = state.collapsedGroups.get(w.id);
        const collapsed = stored !== undefined ? stored : (w.collapsed || false);
        if (collapsed) el.classList.add('collapsed');

        const header = document.createElement('div');
        header.className = 'card-header';
        header.innerHTML = `<span>${escapeHtml(w.label)}</span><span class="chev">▾</span>`;
        header.addEventListener('click', () => {
          const nowCollapsed = el.classList.toggle('collapsed');
          state.collapsedGroups.set(w.id, nowCollapsed);
        });
        el.appendChild(header);

        const body = document.createElement('div');
        body.className = 'card-body' + (alignment === 'horizontal' ? ' horizontal' : '');
        for (const child of children) body.appendChild(renderWidget(child, byParent));
        el.appendChild(body);
      } else {
        el.className = 'flat' + (alignment === 'horizontal' ? ' horizontal' : '');
        for (const child of children) el.appendChild(renderWidget(child, byParent));
      }

      return el;
    }

    function renderToggle(w) {
      const el = document.createElement('div');
      el.className = 'widget';
      el.innerHTML = `
        <div class="row">
            <span class="label">${escapeHtml(w.label || '')}</span>
            <input type="checkbox" class="switch" ${w.value ? 'checked' : ''}>
        </div>
    `;
      const cb = el.querySelector('input');
      cb.addEventListener('change', () => sendAction(w.id, cb.checked));
      return el;
    }

    function renderIndicator(w) {
      const el = document.createElement('div');
      el.className = 'widget';
      el.innerHTML = `
        <div class="row">
            <span class="label">${escapeHtml(w.label || '')}</span>
            <input type="checkbox" class="indicator" ${w.enabled ? 'checked' : ''}>
        </div>
    `;
      const cb = el.querySelector('input');
      cb.addEventListener('change', () => sendAction(w.id, cb.checked));
      return el;
    }

    function renderSlider(w) {
      const el = document.createElement('div');
      el.className = 'widget';
      const min = w.min ?? 0, max = w.max ?? 100, val = w.value ?? min;
      el.innerHTML = `
        <div class="row">
            <span class="label">${escapeHtml(w.label || '')}</span>
            <span class="value">${val}</span>
        </div>
        <input type="range" class="range" min="${min}" max="${max}" value="${val}">
    `;

      const range = el.querySelector('input');
      const display = el.querySelector('.value');
      let throttleTimer = null, pendingValue = null;

      const flush = () => {
        throttleTimer = null;
        if (pendingValue !== null) { sendAction(w.id, pendingValue); pendingValue = null; }
      };

      range.addEventListener('input', () => {
        const v = parseInt(range.value, 10);
        display.textContent = v;
        pendingValue = v;
        if (!throttleTimer) throttleTimer = setTimeout(flush, 60);
      });
      range.addEventListener('change', () => {
        pendingValue = parseInt(range.value, 10);
        if (throttleTimer) { clearTimeout(throttleTimer); flush(); }
      });
      return el;
    }

    function renderInput(w) {
      const el = document.createElement('div');
      el.className = 'widget';
      const type = w.input_type || 'text';
      const id = `inp-${w.id}`;
      el.innerHTML = `
        <label class="label" for="${id}">${escapeHtml(w.label || '')}</label>
        <input type="${escapeHtml(type)}" class="input" id="${id}"
               value="${escapeHtml(w.value ?? '')}"
               placeholder="${escapeHtml(w.placeholder || '')}"
               spellcheck="false" autocomplete="off">
    `;
      const inp = el.querySelector('input');
      inp.addEventListener('blur', () => {
        if (inp.value !== String(w.value ?? '')) sendAction(w.id, inp.value);
      });
      inp.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') { e.preventDefault(); inp.blur(); }
        if (e.key === 'Escape') { inp.value = String(w.value ?? ''); inp.blur(); }
      });
      return el;
    }

    function renderSelect(w) {
      const el = document.createElement('div');
      el.className = 'widget';
      const selectedIndex = w.selected_index ?? w.value ?? 0;
      const id = `sel-${w.id}`;
      const options = (w.options || []).map((label, i) =>
        `<option value="${i}" ${i === selectedIndex ? 'selected' : ''}>${escapeHtml(label)}</option>`
      ).join('');
      el.innerHTML = `
        <label class="label" for="${id}">${escapeHtml(w.label || '')}</label>
        <select class="select" id="${id}">${options}</select>
    `;
      const sel = el.querySelector('select');
      sel.addEventListener('change', () => sendAction(w.id, parseInt(sel.value, 10)));
      return el;
    }

    function renderButton(w) {
      const el = document.createElement('div');
      el.className = 'widget';
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'btn block';
      btn.textContent = w.label || 'Button';
      btn.addEventListener('click', () => sendAction(w.id, w.value ?? 'click'));
      el.appendChild(btn);
      return el;
    }

    function renderProgressBar(w) {
      const el = document.createElement('div');
      el.className = 'widget';
      const progress = Math.max(0, Math.min(100, w.progress ?? 0));
      const hasLabel = (w.label || '').length > 0;
      const hasText = (w.text || '').length > 0;

      el.innerHTML = `
        ${(hasLabel || hasText) ? `
            <div class="row">
                <span class="label">${escapeHtml(w.label || '')}</span>
                <span class="value">${escapeHtml(w.text || '')}</span>
            </div>
        ` : ''}
        <div class="progress">
            <div class="progress-fill" style="width:${progress}%"></div>
        </div>
    `;
      return el;
    }

    function renderProgressRing(w) {
      const el = document.createElement('div');
      el.className = 'widget';
      el.innerHTML = `
        <div class="row">
            <span class="label">${escapeHtml(w.label || '')}</span>
            ${w.in_progress ? '<div class="spinner"></div>' : '<div class="ring-off"></div>'}
        </div>
    `;
      return el;
    }

    function renderLabel(w) {
      const el = document.createElement('div');
      el.className = 'widget';
      if (w.label && w.label.length > 0) {
        el.innerHTML = `
            <div class="row">
                <span class="label">${escapeHtml(w.label)}</span>
                <span class="value">${escapeHtml(w.text || '')}</span>
            </div>
        `;
      } else {
        el.innerHTML = `<div class="value">${escapeHtml(w.text || '')}</div>`;
      }
      return el;
    }

    /* ─── Log widget ─── */
    function renderLog(w) {
      const el = document.createElement('div');
      el.className = 'widget';
      el.dataset.widgetType = 'log';
      const hasLabel = (w.label || '').length > 0;
      el.innerHTML = `
        ${hasLabel ? `<label class="label">${escapeHtml(w.label)}</label>` : ''}
        <pre class="log" data-log-target></pre>
    `;

      // Merge device records into shared log state
      syncDeviceLog(w.text ?? '');

      // Render current combined log
      const pre = el.querySelector('.log');
      pre.textContent = formatLogs();
      return el;
    }

    function renderNotification(w) {
      const el = document.createElement('div');
      el.className = 'widget';
      const kind = w.kind || 'info';
      el.innerHTML = `<div class="notice ${kind}">${escapeHtml(w.message || '')}</div>`;
      return el;
    }

    /* ─── Init ─── */
    window.addEventListener('DOMContentLoaded', connect);
    window.addEventListener('beforeunload', () => { if (state.ws) state.ws.close(); });
    document.addEventListener('visibilitychange', () => {
      if (!document.hidden && !state.connected && !state.reconnectTimer) connect();
    });
  </script>
</body>

</html>
