<!doctype html>
<html lang="en">
    <meta charset="UTF-8" /><meta
        content="width=device-width,initial-scale=1"
        name="viewport"
    /><title>ESP32 Settings</title
    ><style>
        *,

        ::before {

        }
        :root {

            --primary-hover: #0b5ed7;

                --primary: #4a9eff;
                --primary-hover: #3a8eef;
                --primary-rgb: 74, 158, 255;
                --bg-body: #0f1115;
                --bg-card: #1a1d23;
                --bg-header: #202530;
                --text-main: #e5e7eb;
                --text-muted: #9ca3af;
                --border-color: #2d323c;
                --shadow-card: 0 1px 3px rgba(0, 0, 0, 0.4);
                --shadow-hover: 0 4px 16px rgba(0, 0, 0, 0.5);

        body {
            max-width: 600px;
            margin: 0 auto;
            padding: 16px;
            font:
                14px/1.5 system-ui,
                -apple-system,
                "Segoe UI",
                Roboto,
                sans-serif;
            color: var(--text-main);
            background: var(--bg-body);
            transition:
                background 0.15s,
                color 0.15s;
        }
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 16px;
            margin-bottom: 20px;
            border-bottom: 1px solid var(--border-color);
        }
        h1 {
            font-size: 18px;
            font-weight: 600;
            margin: 0;
            letter-spacing: -0.01em;
        }
        .status {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 12px;
            font-weight: 500;
            color: var(--text-muted);
            padding: 4px 10px;
            background: var(--bg-card);
            border-radius: var(--radius-pill);
            box-shadow: var(--shadow-card);

        }

            background: #22c55e;
        }

            background: #f59e0b;
            animation: pulse 1.2s infinite;
        }
        .status.error::before {
            background: #ef4444;
        }

            }

            padding: 4px;
            background: var(--bg-card);
            border-radius: var(--radius-pill);
            box-shadow: var(--shadow-card);
            margin-bottom: 20px;
            overflow-x: auto;
            scrollbar-width: none;
        }
        .tabs::-webkit-scrollbar {
            display: none;
        }
        .tab {
            flex: 1;
            padding: 8px 16px;
            font: inherit;
            font-size: 13px;
            font-weight: 500;
            color: var(--text-muted);
            background: 0 0;
            border: none;
            border-radius: var(--radius-pill);
            cursor: pointer;
            white-space: nowrap;
            transition: all 0.15s;

            background: var(--primary);
        }
        .panel {
            display: none;
        }

            display: flex;
            flex-direction: column;
            gap: 16px;
        }

            align-items: center;
            font-size: 14px;
            font-weight: 600;

            background-color: var(--bg-header);
            border-bottom: 1px solid var(--border-color);

            border-bottom: none;

            display: flex;
            flex-direction: column;
            gap: 16px;

            flex-wrap: wrap;
            align-items: flex-end;
        }

            min-width: 0;
        }
        .flat {
            display: flex;
            flex-direction: column;
            gap: 16px;
            padding: 4px 0;
        }
        .flat.horizontal {
            flex-direction: row;
            flex-wrap: wrap;
            align-items: flex-end;
        }
        .flat.horizontal > * {
            flex: 1 1 140px;
            min-width: 0;
        }

            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        .row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
        }
        .label {
            font-size: 13px;
            font-weight: 500;
            color: var(--text-main);
        }

            color: var(--text-muted);
            font-variant-numeric: tabular-nums;

            font-size: 13px;

            color: var(--text-muted);

            appearance: none;
            width: 100%;
            height: 6px;
            background: var(--border-color);
            border-radius: 999px;
            outline: 0;
            margin: 8px 0;

            appearance: none;
            width: 18px;
            height: 18px;
            background: var(--primary);
            border: 2px solid var(--bg-card);
            border-radius: 50%;
            box-shadow: 0 1px 4px rgba(0, 0, 0, 0.2);
            cursor: pointer;

            height: 18px;
            background: var(--primary);
            border: 2px solid var(--bg-card);
            border-radius: 50%;
            box-shadow: 0 1px 4px rgba(0, 0, 0, 0.2);
            cursor: pointer;
        }

            -webkit-appearance: none;

            flex-shrink: 0;

            height: 20px;
            background: var(--border-color);

            margin: 0;
            border: none;
            transition: background 0.15s;

            left: 2px;

            height: 16px;

            box-shadow: 0 1px 2px rgba(0, 0, 0, 0.2);
            transition: left 0.15s;

            background: var(--primary);

            left: 18px;
        }

            -webkit-appearance: none;
            width: 14px;
            height: 14px;
            border-radius: 50%;
            border: 1px solid var(--border-color);
            background: 0 0;
            cursor: pointer;
            margin: 0;
            flex-shrink: 0;
            transition: background 0.15s;

            background: var(--primary);
            border-color: var(--primary);
        }
        .btn {
            padding: 8px 16px;
            font: inherit;
            font-size: 13px;
            font-weight: 500;
            color: #fff;
            background: var(--primary);
            border: none;
            border-radius: var(--radius-control);
            cursor: pointer;
            transition:
                background 0.15s,
                transform 50ms;
            width: 100%;

        .btn:hover {
            background: var(--primary-hover);
        }
        .btn:active {
            transform: scale(0.98);
        }
        .btn.outline {
            background: 0 0;
            color: var(--primary);
            border: 1px solid var(--primary);
        }

            height: 8px;
            background: var(--border-color);
            border-radius: 999px;
            overflow: hidden;
        }
        .progress-fill {
            height: 100%;
            background: var(--primary);
            border-radius: 999px;
            transition: width 0.3s;
        }

            height: 16px;
            border: 2px solid var(--border-color);
            border-top-color: var(--primary);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            flex-shrink: 0;
        }

            to {
                transform: rotate(360deg);
            }
        }
        .ring-off {
            width: 16px;
            height: 16px;
            border-radius: 50%;
            border: 2px solid var(--border-color);
            flex-shrink: 0;
        }

            background: var(--bg-body);
            border-radius: var(--radius-control);

                11px/1.5 ui-monospace,
                Menlo,
                monospace;

            overflow: auto;
            white-space: pre-wrap;
            word-break: break-word;
            margin: 0;
            color: var(--text-main);
            border: 1px solid var(--border-color);
        }

            border-radius: var(--radius-control);
            font-size: 13px;
            background: var(--bg-card);

        }
        .notice.error {
            border-left-color: #ef4444;
        }
        #toast-container {

            bottom: 16px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            flex-direction: column;
            gap: 6px;
            z-index: 100;
        }
        .toast {
            padding: 8px 16px;
            background: var(--text-main);
            color: var(--bg-card);
            border-radius: var(--radius-pill);
            font-size: 13px;
            box-shadow: var(--shadow-hover);

        }
        .empty {
            text-align: center;
            padding: 48px 16px;
            color: var(--text-muted);
            font-size: 13px;
        }
        #widgets {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }
        @media (max-width: 480px) {
            body {
                padding: 12px;
            }
            .tab {
                padding: 6px 12px;
                font-size: 12px;
            }
            .card-body {
                padding: 12px;
            }
        }

        function renderInput(t) {
            const e = document.createElement("div");
            e.className = "widget";
            var n = t.input_type || "text",
                a = `inp-${t.id}`;
            e.innerHTML = `
        <label class="label" for="${a}">${escapeHtml(t.label || "")}</label>
        <input type="${escapeHtml(n)}" class="input" id="${a}"
               value="${escapeHtml(t.value ?? "")}"
               placeholder="${escapeHtml(t.placeholder || "")}"
               spellcheck="false" autocomplete="off">
    `;
            const s = e.querySelector("input");
            return (
                s.addEventListener("blur", () => {
                    s.value !== String(t.value ?? "") && sendAction(t, s.value);
                }),
                s.addEventListener("keydown", (e) => {
                    ("Enter" === e.key && (e.preventDefault(), s.blur()),
                        "Escape" === e.key &&
                            ((s.value = String(t.value ?? "")), s.blur()));
                }),
                e
            );
        }
        function renderSelect(e) {
            const t = document.createElement("div");
            t.className = "widget";
            const n = e.selected_index ?? e.value ?? 0;
            var a = `sel-${e.id}`,
                s = (e.options || [])
                    .map(
                        (e, t) =>
                            `<option value="${t}" ${t === n ? "selected" : ""}>${escapeHtml(e)}</option>`,
                    )
                    .join("");
            t.innerHTML = `
        <label class="label" for="${a}">${escapeHtml(e.label || "")}</label>
        <select class="select" id="${a}">${s}</select>
    `;
            const c = t.querySelector("select");
            return (
                c.addEventListener("change", () =>
                    sendAction(e, parseInt(c.value, 10)),
                ),
                t
            );
        }
        function renderButton(e) {
            const t = document.createElement("div");
            t.className = "widget";
            const n = document.createElement("button");
            return (
                (n.type = "button"),
                (n.className = "btn"),
                (n.textContent = e.label || "Button"),
                n.addEventListener("click", () =>
                    sendAction(e, e.value ?? "click"),
                ),
                t.appendChild(n),
                t
            );
        }
        function renderProgressBar(e) {
            const t = document.createElement("div");
            t.className = "widget";
            var n = Math.max(0, Math.min(100, e.progress ?? 0)),
                a = 0 < (e.label || "").length,
                s = 0 < (e.text || "").length;
            return (
                (t.innerHTML = `
        ${
            a || s
                ? `
            <div class="row">
                <span class="label">${escapeHtml(e.label || "")}</span>
                <span class="value">${escapeHtml(e.text || "")}</span>
            </div>
        `
                : ""
        }
        <div class="progress">
            <div class="progress-fill" style="width:${n}%"></div>
        </div>
    `),
                t
            );
        }
        function renderProgressRing(e) {
            const t = document.createElement("div");
            return (
                (t.className = "widget"),
                (t.innerHTML = `
        <div class="row">
            <span class="label">${escapeHtml(e.label || "")}</span>
            ${e.in_progress ? '<div class="spinner"></div>' : '<div class="ring-off"></div>'}
        </div>
    `),
                t
            );
        }
        function renderLabel(e) {
            const t = document.createElement("div");
            return (
                (t.className = "widget"),
                e.label && 0 < e.label.length
                    ? (t.innerHTML = `
            <div class="row">
                <span class="label">${escapeHtml(e.label)}</span>
                <span class="value">${escapeHtml(e.text || "")}</span>
            </div>
        `)
                    : (t.innerHTML = `<div class="value">${escapeHtml(e.text || "")}</div>`),
                t
            );
        }
        function renderLog(e) {
            const t = document.createElement("div");
            t.className = "widget";
            var n = 0 < (e.label || "").length;
            return (
                (t.innerHTML = `
        ${n ? `<label class="label">${escapeHtml(e.label)}</label>` : ""}
        <pre class="log">${escapeHtml(e.text || "")}</pre>
    `),
                t
            );
        }
        function renderNotification(e) {
            const t = document.createElement("div");
            t.className = "widget";
            var n = e.kind || "info";
            return (
                (t.innerHTML = `<div class="notice ${n}">${escapeHtml(e.message || "")}</div>`),
                t
            );
        }
        (window.addEventListener("DOMContentLoaded", connect),
            window.addEventListener("beforeunload", () => {
                state.ws && state.ws.close();
            }),
            document.addEventListener("visibilitychange", () => {
                document.hidden ||
                    state.connected ||
                    state.reconnectTimer ||
                    connect();
            }));
    </script>
</html>
