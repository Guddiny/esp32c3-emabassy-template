<!doctypehtml>
    <html lang=en>
    <meta charset=UTF-8>
    <meta content="width=device-width,initial-scale=1" name=viewport>
    <title>ESP32 Settings</title>
    <style>
        *,
        ::after,
        ::before {
            box-sizing: border-box
        }

        :root {
            --primary: #0d6efd;
            --primary-hover: #0b5ed7;
            --primary-rgb: 13, 110, 253;
            --bg-body: #f5f7fa;
            --bg-header: #f5f7fa;
            --bg-card: #ffffff;
            --text-main: #1a1d21;
            --text-muted: #6b7280;
            --border-color: #e5e7eb;
            --radius-card: 12px;
            --radius-control: 8px;
            --radius-pill: 20px;
            --shadow-card: 0 1px 3px rgba(0, 0, 0, 0.06), 0 1px 2px rgba(0, 0, 0, 0.04);
            --shadow-hover: 0 4px 12px rgba(0, 0, 0, 0.08)
        }

        @media (prefers-color-scheme:dark) {
            :root {
                --primary: #4a9eff;
                --primary-hover: #3a8eef;
                --primary-rgb: 74, 158, 255;
                --bg-body: #0f1115;
                --bg-card: #1a1d23;
                --bg-header: #202530;
                --text-main: #e5e7eb;
                --text-muted: #9ca3af;
                --border-color: #2d323c;
                --shadow-card: 0 1px 3px rgba(0, 0, 0, 0.4);
                --shadow-hover: 0 4px 16px rgba(0, 0, 0, 0.5)
            }
        }

        body {
            max-width: 600px;
            margin: 0 auto;
            padding: 16px;
            font: 14px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
            color: var(--text-main);
            background: var(--bg-body);
            transition: background .15s, color .15s
        }

        body:has(.log) {
            height: 100vh;
            height: 100dvh;
            display: flex;
            flex-direction: column
        }

        .tabs,
        body:has(.log)>header {
            flex-shrink: 0
        }

        .card-body:has(.log),
        .card:has(.log),
        .flat:has(.log),
        .log-widget,
        .panel.active:has(.log),
        body:has(.log)>#widgets {
            flex: 1;
            min-height: 0
        }

        .card:has(.log) {
            display: flex;
            flex-direction: column
        }

        .card:has(.log)>.card-header {
            flex-shrink: 0
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 16px;
            margin-bottom: 20px;
            border-bottom: 1px solid var(--border-color)
        }

        h1 {
            font-size: 18px;
            font-weight: 600;
            margin: 0;
            letter-spacing: -.01em
        }

        .status {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 12px;
            font-weight: 500;
            color: var(--text-muted);
            padding: 4px 10px;
            background: var(--bg-card);
            border-radius: var(--radius-pill);
            box-shadow: var(--shadow-card)
        }

        .status::before {
            content: "";
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--text-muted);
            transition: background .2s
        }

        .status.connected::before {
            background: #22c55e
        }

        .status.connecting::before {
            background: #f59e0b;
            animation: pulse 1.2s infinite
        }

        .status.error::before {
            background: #ef4444
        }

        @keyframes pulse {
            50% {
                opacity: .3
            }
        }

        .tabs {
            display: flex;
            gap: 4px;
            padding: 4px;
            background: var(--bg-card);
            border-radius: var(--radius-pill);
            box-shadow: var(--shadow-card);
            margin-bottom: 20px;
            overflow-x: auto;
            scrollbar-width: none
        }

        .tabs::-webkit-scrollbar {
            display: none
        }

        .tab {
            flex: 1;
            padding: 8px 16px;
            font: inherit;
            font-size: 13px;
            font-weight: 500;
            color: var(--text-muted);
            background: 0 0;
            border: none;
            border-radius: var(--radius-pill);
            cursor: pointer;
            white-space: nowrap;
            transition: all .15s
        }

        .tab.active {
            color: #fff;
            background: var(--primary)
        }

        .panel {
            display: none
        }

        .panel.active {
            display: flex;
            flex-direction: column;
            gap: 16px
        }

        .card {
            background: var(--bg-card);
            border-radius: var(--radius-card);
            box-shadow: var(--shadow-card);
            overflow: hidden;
            transition: box-shadow .15s
        }

        .card:hover {
            box-shadow: var(--shadow-hover)
        }

        .card-header {
            padding: 14px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            user-select: none;
            background-color: var(--bg-header);
            border-bottom: 1px solid var(--border-color)
        }

        .card.collapsed .card-header {
            border-bottom: none
        }

        .chev {
            font-size: 12px;
            color: var(--text-muted);
            transition: transform .15s
        }

        .card.collapsed .chev {
            transform: rotate(-90deg)
        }

        .card-body {
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 16px
        }

        .card-body.horizontal {
            flex-direction: row;
            flex-wrap: wrap;
            align-items: flex-end
        }

        .card-body.horizontal>* {
            flex: 1 1 140px;
            min-width: 0
        }

        .flat {
            display: flex;
            flex-direction: column;
            gap: 16px;
            padding: 4px 0
        }

        .flat.horizontal {
            flex-direction: row;
            flex-wrap: wrap;
            align-items: flex-end
        }

        .flat.horizontal>* {
            flex: 1 1 140px;
            min-width: 0
        }

        .widget {
            display: flex;
            flex-direction: column;
            gap: 6px
        }

        .widget.changed {
            position: relative
        }

        .widget.changed::before {
            content: "";
            position: absolute;
            left: -8px;
            top: 2px;
            bottom: 2px;
            width: 3px;
            border-radius: 2px;
            background: var(--primary)
        }

        .row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px
        }

        .label {
            font-size: 13px;
            font-weight: 500;
            color: var(--text-main)
        }

        .value {
            font-size: 12px;
            color: var(--text-muted);
            font-variant-numeric: tabular-nums
        }

        .input,
        .select {
            width: 100%;
            padding: 8px 12px;
            font: inherit;
            font-size: 13px;
            color: var(--text-main);
            background: var(--bg-body);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-control);
            outline: 0;
            transition: border-color .15s, box-shadow .15s
        }

        .input:focus,
        .select:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(var(--primary-rgb), .15)
        }

        .input::placeholder {
            color: var(--text-muted)
        }

        .range {
            -webkit-appearance: none;
            appearance: none;
            width: 100%;
            height: 6px;
            background: var(--border-color);
            border-radius: 999px;
            outline: 0;
            margin: 8px 0
        }

        .range::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 18px;
            height: 18px;
            background: var(--primary);
            border: 2px solid var(--bg-card);
            border-radius: 50%;
            box-shadow: 0 1px 4px rgba(0, 0, 0, .2);
            cursor: pointer
        }

        .range::-moz-range-thumb {
            width: 18px;
            height: 18px;
            background: var(--primary);
            border: 2px solid var(--bg-card);
            border-radius: 50%;
            box-shadow: 0 1px 4px rgba(0, 0, 0, .2);
            cursor: pointer
        }

        .switch {
            appearance: none;
            -webkit-appearance: none;
            position: relative;
            flex-shrink: 0;
            width: 36px;
            height: 20px;
            background: var(--border-color);
            border-radius: 10px;
            cursor: pointer;
            margin: 0;
            border: none;
            transition: background .15s
        }

        .switch::after {
            content: "";
            position: absolute;
            top: 2px;
            left: 2px;
            width: 16px;
            height: 16px;
            background: #fff;
            border-radius: 50%;
            box-shadow: 0 1px 2px rgba(0, 0, 0, .2);
            transition: left .15s
        }

        .switch:checked {
            background: var(--primary)
        }

        .switch:checked::after {
            left: 18px
        }

        .indicator {
            appearance: none;
            -webkit-appearance: none;
            width: 14px;
            height: 14px;
            border-radius: 50%;
            border: 1px solid var(--border-color);
            background: 0 0;
            cursor: pointer;
            margin: 0;
            flex-shrink: 0;
            transition: background .15s
        }

        .indicator:checked {
            background: var(--primary);
            border-color: var(--primary)
        }

        .btn {
            padding: 8px 16px;
            font: inherit;
            font-size: 13px;
            font-weight: 500;
            color: #fff;
            background: var(--primary);
            border: none;
            border-radius: var(--radius-control);
            cursor: pointer;
            transition: background .15s, transform 50ms;
            width: 100%
        }

        .btn:hover {
            background: var(--primary-hover)
        }

        .btn:active {
            transform: scale(.98)
        }

        .btn.outline {
            background: 0 0;
            color: var(--primary);
            border: 1px solid var(--primary)
        }

        .progress {
            width: 100%;
            height: 8px;
            background: var(--border-color);
            border-radius: 999px;
            overflow: hidden
        }

        .progress-fill {
            height: 100%;
            background: var(--primary);
            border-radius: 999px;
            transition: width .3s
        }

        .spinner {
            width: 16px;
            height: 16px;
            border: 2px solid var(--border-color);
            border-top-color: var(--primary);
            border-radius: 50%;
            animation: spin .8s linear infinite;
            flex-shrink: 0
        }

        @keyframes spin {
            to {
                transform: rotate(360deg)
            }
        }

        .ring-off {
            width: 16px;
            height: 16px;
            border-radius: 50%;
            border: 2px solid var(--border-color);
            flex-shrink: 0
        }

        .log {
            flex: 1;
            min-height: 100px;
            padding: 10px;
            background: var(--bg-body);
            border-radius: var(--radius-control);
            font: 11px/1.5 ui-monospace, Menlo, monospace;
            overflow: auto;
            white-space: pre-wrap;
            word-break: break-word;
            margin: 0;
            list-style: none;
            color: var(--text-main);
            border: 1px solid var(--border-color)
        }

        .notice {
            padding: 10px 12px;
            border-left: 3px solid var(--primary);
            border-radius: var(--radius-control);
            font-size: 13px;
            background: var(--bg-card)
        }

        .notice.warning {
            border-left-color: #f59e0b
        }

        .notice.error {
            border-left-color: #ef4444
        }

        #toast-container {
            position: fixed;
            bottom: 16px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            flex-direction: column;
            gap: 6px;
            z-index: 100
        }

        .toast {
            padding: 8px 16px;
            background: var(--text-main);
            color: var(--bg-card);
            border-radius: var(--radius-pill);
            font-size: 13px;
            box-shadow: var(--shadow-hover);
            animation: slidein .2s ease;
            max-width: min(100vw - 32px, 480px);
            word-break: break-word
        }

        .toast.toast-info {
            background: var(--primary);
            color: #fff
        }

        .toast.toast-success {
            background: #22c55e;
            color: #fff
        }

        .toast.toast-warning {
            background: #f59e0b;
            color: #111
        }

        .toast.toast-error {
            background: #ef4444;
            color: #fff
        }

        @keyframes slidein {
            from {
                opacity: 0;
                transform: translateY(8px)
            }

            to {
                opacity: 1;
                transform: translateY(0)
            }
        }

        .empty {
            text-align: center;
            padding: 48px 16px;
            color: var(--text-muted);
            font-size: 13px
        }

        #widgets {
            display: flex;
            flex-direction: column;
            gap: 16px
        }

        @media (max-width:480px) {
            body {
                padding: 12px
            }

            .tab {
                padding: 6px 12px;
                font-size: 12px
            }

            .card-body {
                padding: 12px
            }
        }
    </style>
